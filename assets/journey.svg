<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="74" viewBox="0 0 1200 74" role="img" aria-label="Explore, build, learn, repeat">
<style>
.node { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite alternate; }
.two { animation-delay: .5s } .three { animation-delay: 1s } .four { animation-delay: 1.5s }
@keyframes glow { from { opacity: .5 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .node { animation: none } }
</style>
<rect width="1200" height="74" rx="12" fill="#10192d"/>
<path d="M80 37 H1120" stroke="#3c5772" stroke-width="2" stroke-dasharray="5 9"/>
<g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" text-anchor="middle">
<g class="node"><rect x="75" y="17" width="170" height="40" rx="20" fill="#123d45" stroke="#52d7bd"/><text x="160" y="43" fill="#9cf1df">EXPLORE</text></g>
<g class="node two"><rect x="368" y="17" width="170" height="40" rx="20" fill="#252c51" stroke="#8fa9ff"/><text x="453" y="43" fill="#c4d1ff">BUILD</text></g>
<g class="node three"><rect x="662" y="17" width="170" height="40" rx="20" fill="#3a284d" stroke="#cb9ff4"/><text x="747" y="43" fill="#e5c8ff">LEARN</text></g>
<g class="node four"><rect x="955" y="17" width="170" height="40" rx="20" fill="#3d3932" stroke="#e1bf7d"/><text x="1040" y="43" fill="#f7dca6">REPEAT</text></g>
</g></svg>